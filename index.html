<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Prafull Dattatray Dhumal | Sales & Distribution Specialist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.6; }
        
        /* Modern Corporate Header with Subtle Business Background */
        header { 
            background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(30, 58, 138, 0.92)), 
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: white; 
            padding: 60px 20px; 
            text-align: center; 
        }
        
        /* Profile Image Styling */
        .profile-img-container { margin-bottom: 15px; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #ffffff; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.3); background-color: #ffffff; }
        
        header h1 { font-size: 2.3rem; margin-bottom: 8px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1.2rem; opacity: 0.95; max-width: 600px; margin: 0 auto; }
        .badge { display: inline-block; background: #f59e0b; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; margin-top: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        
        container { max-width: 1100px; margin: 0 auto; padding: 30px 15px; display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .card h3 { color: #1e3a8a; margin-bottom: 15px; font-size: 1.3rem; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        .card ul { list-style: none; }
        .card ul li { padding: 12px 0; border-bottom: 1px dashed #e2e8f0; font-size: 0.95rem; }
        .card ul li:last-child { border-bottom: none; }
        
        .stats-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .stats-box h4 { color: #1e3a8a; font-size: 1.1rem; }

        /* Biodata Summary Box */
        .bio-box { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .bio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 10px; }
        .bio-item { background: #f8fafc; padding: 12px 15px; border-radius: 8px; border-left: 3px solid #3b82f6; }
        .bio-item span { display: block; font-size: 0.8rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .bio-item strong { font-size: 0.95rem; color: #0f172a; word-break: break-word; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.92rem; }
        th { background-color: #eff6ff; color: #1e3a8a; font-weight: 600; }
        
        .cta-section { text-align: center; background: #0f172a; color: white; padding: 40px 20px; margin-top: 30px; border-radius: 16px; }
        .btn-whatsapp { display: inline-block; background: #22c55e; color: white; text-decoration: none; padding: 14px 28px; border-radius: 30px; font-weight: bold; font-size: 1.1rem; margin-top: 15px; transition: 0.3s; }
        .btn-whatsapp:hover { background: #16a34a; }
